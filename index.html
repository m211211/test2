/* ---------- 付箋へジャンプ（検索結果・リンクから） ---------- */
function jumpToNote(id){
  const rec=allNoteRecords().find(x=>x.note.id===id);
  if(!rec) return;
  closeSearchResults();
  if(rec.location==='フリースペース') switchMainTab('free');
  else if(rec.location==='共通ストック'){ /* ストックは常時表示中のタブに存在するのでタブ切替は不要 */ }
  else if(rec.location.startsWith('毎週')) switchMainTab('habits');
  else {
    const d=rec.location.replace('カレンダー ','');
    if(/^\d{4}-\d{2}-\d{2}$/.test(d)){ selectedDateStr=d; currentYear=+d.slice(0,4); currentMonth=+d.slice(5,7)-1; persistViewState(); }
    switchMainTab('calendar');
  }
  setTimeout(()=>{
    let el=document.getElementById(id);
    if(!el){
      if(rec.location.startsWith('カレンダー')) openDayDetail(rec.location.replace('カレンダー ',''));
      else if(rec.location.startsWith('毎週')){
        const idx=['日','月','火','水','木','金','土'].indexOf(rec.location.replace('毎週 ','').replace('曜日',''));
        if(idx>=0) openWeeklyDetail('day-'+idx);
      }
      el=document.getElementById(id);
    }
    if(!el) return;
    let changed=false, p=el;
    while(p){
      if(p.classList && p.classList.contains('note-collapsed')){
        p.classList.remove('note-collapsed');
        const r=findNote(p.id); if(r){ r.note.collapsed=false; changed=true; }
      }
      p=p.parentElement;
    }
    if(changed) save();
    el.scrollIntoView({behavior:'smooth',block:'center'});
    el.classList.add('note-link-flash');
    setTimeout(()=>el.classList.remove('note-link-flash'),1200);
  }, 120);
}

/* ---------- 付箋リンク ---------- */
function openLinkPicker(id){
  pendingLinkSourceId=id;
  const list=document.getElementById('linkTargetList'); list.innerHTML='';
  const all=allNoteRecords().filter(x=>x.note.id!==id);
  if(!all.length){ list.innerHTML='<div style="font-size:12px;color:#9CA3AF;">リンクできる付箋がまだありません</div>'; }
  all.forEach(x=>{
    const b=document.createElement('button'); b.className='btn-tool'; b.style.cssText='text-align:left;justify-content:flex-start;width:100%;';
    b.textContent=(x.note.text||'（無題）').slice(0,60)+'　['+x.location+']';
    b.onclick=()=>{
      const src=findNote(pendingLinkSourceId);
      if(src){
        src.note.links=src.note.links||[];
        if(!src.note.links.some(l=>l.id===x.note.id)){ src.note.links.push({id:x.note.id,label:x.note.text||'無題'}); save(); render(); }
      }
      closeLinkModal();
    };
    list.appendChild(b);
  });
  document.getElementById('linkModal').classList.add('open');
}
function closeLinkModal(){ document.getElementById('linkModal').classList.remove('open'); pendingLinkSourceId=null; }

/* ---------- 移動先を選んで動かす（ドラッグが難しいスマホ向け） ---------- */
function closeMoveModal(){ document.getElementById('moveModal')?.classList.remove('open'); }
function openMovePicker(id){
  const body=document.getElementById('moveModalBody'); body.innerHTML='';
  const done=(dest)=>{ if(applyMove(id,dest)){ closeMoveModal(); closeDetailModal(); } };
  const mkRow=(labelText)=>{ const r=document.createElement('div'); r.className='move-row'; const l=document.createElement('span'); l.className='label-sm'; l.textContent=labelText; r.appendChild(l); body.appendChild(r); return r; };
  const mkBtn=(row,text,fn)=>{ const b=document.createElement('button'); b.type='button'; b.className='btn-tool'; b.textContent=text; b.onclick=fn; row.appendChild(b); return b; };
  const r1=mkRow('日付へ移動');
  const inp=document.createElement('input'); inp.type='date'; inp.value=/^\d{4}-\d{2}-\d{2}$/.test(selectedDateStr)?selectedDateStr:REAL_TODAY; r1.appendChild(inp);
  mkBtn(r1,'この日へ', ()=>{ if(inp.value) done({type:'date',date:inp.value}); });
  const r2=mkRow('そのほか');
  mkBtn(r2,'📦 ストックへ', ()=>done({type:'stock'}));
  mkBtn(r2,'✦ フリースペースへ', ()=>done({type:'free', x:24, y:24+((notesData.free||[]).length%10)*24}));
  const r3=mkRow('毎週の曜日へ');
  ['日','月','火','水','木','金','土'].forEach((h,i)=>mkBtn(r3,h, ()=>done({type:'weekly',key:'day-'+i})));
  document.getElementById('moveModal').classList.add('open');
}

/* ---------- 色ポップオーバー ---------- */
function closeColorPopoverOnce(e){ if(!e.target.closest('.color-popover')) closeColorPopover(); }
function closeColorPopover(){ document.getElementById('colorPopover')?.remove(); document.removeEventListener('click', closeColorPopoverOnce); }
function openColorPopover(e, noteId){
  closeColorPopover();
  const pop=document.createElement('div'); pop.className='color-popover'; pop.id='colorPopover';
  const r=e.target.getBoundingClientRect();
  pop.style.left=Math.max(4,Math.min(r.left, window.innerWidth-180))+'px';
  pop.style.top=(r.bottom+6)+'px';
  const rec=findNote(noteId);
  ['yellow','pink','blue','green','purple','orange'].forEach(c=>{
    const sw=document.createElement('button'); sw.type='button';
    sw.className='color-popover-swatch'+(rec&&rec.note.color===c?' current':'');
    sw.style.background=colorHex[c]; sw.title=c;
    sw.onclick=(ev)=>{ ev.stopPropagation(); if(rec){ rec.note.color=c; save(); render(); } closeColorPopover(); };
    pop.appendChild(sw);
  });
  document.body.appendChild(pop);
  setTimeout(()=>document.addEventListener('click', closeColorPopoverOnce),0);
}

/* ---------- 連続貼付（スタンプ）モード ---------- */
function startStampMode(note){
  if(activeStamp && activeStamp.sourceId===note.id){ exitStampMode(); return; }
  activeStamp={ sourceId:note.id, color:note.color, text:note.text };
  document.querySelectorAll('.sticky-note').forEach(n=>n.classList.remove('copying-source'));
  document.getElementById(note.id)?.classList.add('copying-source');
  document.body.classList.add('is-pasting');
  document.getElementById('stampModeBar').classList.add('active');
}
function exitStampMode(){
  activeStamp=null;
  document.body.classList.remove('is-pasting');
  document.getElementById('stampModeBar').classList.remove('active');
  document.querySelectorAll('.sticky-note').forEach(n=>n.classList.remove('copying-source'));
}

/* ---------- ミニマップ ---------- */
function openMinimap(){
  const modal=document.getElementById('minimapModal');
  document.getElementById('minimapTitle').textContent=`${currentYear}年 ${monthNames[currentMonth]}`;
  const grid=document.getElementById('minimapGrid'); grid.innerHTML='';
  const first=new Date(currentYear,currentMonth,1).getDay();
  const days=new Date(currentYear,currentMonth+1,0).getDate();
  for(let i=0;i<first;i++) grid.appendChild(document.createElement('div'));
  for(let d=1; d<=days; d++){
    const ds=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell=document.createElement('div'); cell.className='minimap-cell'+(ds===REAL_TODAY?' today':'');
    const num=document.createElement('div'); num.textContent=d; cell.appendChild(num);
    const dotsWrap=document.createElement('div'); dotsWrap.className='dots';
    (notesData[ds]||[]).slice(0,6).forEach(n=>{ const dot=document.createElement('span'); dot.className='dot'; dot.style.background=colorHex[n.color]||colorHex.yellow; dotsWrap.appendChild(dot); });
    cell.appendChild(dotsWrap);
    cell.onclick=()=>{ selectedDateStr=ds; persistViewState(); closeMinimap(); render(); setTimeout(()=>document.getElementById('slot-'+ds)?.scrollIntoView({behavior:'smooth',block:'center'}),0); };
    grid.appendChild(cell);
  }
  modal.classList.add('open');
}
function closeMinimap(){ document.getElementById('minimapModal').classList.remove('open'); }

/* ---------- 表示切替・期間移動・タブ ---------- */
function setSelectedColor(color){ lastUsedColor=color; localStorage.setItem('canvas_last_color_v1', color); updateColorUI(); }
function updateColorUI(){
  ['yellow','pink','blue','green','purple','orange'].forEach(c=>{
    document.getElementById('color-btn-'+c)?.classList.toggle('selected', c===lastUsedColor);
    document.getElementById('wcolor-btn-'+c)?.classList.toggle('selected', c===lastUsedColor);
  });
}
function persistViewState(){
  localStorage.setItem('canvas_viewmode_v1', viewMode);
  localStorage.setItem('canvas_selected_v1', selectedDateStr);
}
function setViewMode(mode){
  viewMode=mode;
  ['month','week','list'].forEach(m=>document.getElementById('btn-'+m)?.classList.toggle('active', m===mode));
  persistViewState(); render();
}
function jumpToToday(){
  const d=new Date(); currentYear=d.getFullYear(); currentMonth=d.getMonth(); selectedDateStr=REAL_TODAY;
  persistViewState(); render();
}
function changePeriod(delta){
  if(viewMode==='month' || viewMode==='list'){
    currentMonth+=delta;
    if(currentMonth<0){ currentMonth=11; currentYear--; }
    if(currentMonth>11){ currentMonth=0; currentYear++; }
  } else if(viewMode==='week'){
    const base=new Date(selectedDateStr+'T00:00:00'); base.setDate(base.getDate()+delta*7);
    currentYear=base.getFullYear(); currentMonth=base.getMonth();
    selectedDateStr=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(base.getDate()).padStart(2,'0')}`;
  }
  persistViewState(); render();
}
function switchMainTab(tab){
  currentMainTab=tab;
  ['calendar','habits','free'].forEach(t=>{
    document.getElementById('mtab-'+t)?.classList.toggle('active', t===tab);
    document.getElementById('page-'+t)?.classList.toggle('active', t===tab);
  });
  render();
}

/* ---------- 全体描画 ---------- */
function render(){
  updateColorUI();
  renderCalendarGrid();
  renderWeeklyGrid();
  renderFreeSpace();
  renderStockFor('calendar');
  renderStockFor('habits');
  renderStockFor('free');
  if(activeStamp) document.getElementById(activeStamp.sourceId)?.classList.add('copying-source');
  if(detailCtx) fillDetail();
}

/* ---------- グローバルイベント ---------- */
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Escape') return;
  if(activeStamp){ exitStampMode(); return; }
  if(document.getElementById('backupModal')?.classList.contains('open')){ closeBackupModal(); return; }
  if(document.getElementById('moveModal')?.classList.contains('open')){ closeMoveModal(); return; }
  if(document.getElementById('linkModal')?.classList.contains('open')){ closeLinkModal(); return; }
  closeDetailModal(); closeMinimap(); closeColorPopover();
});
document.addEventListener('click', (e)=>{
  if(!activeStamp) return;
  const ok=e.target.closest('.day-slot') || e.target.closest('.sticky-note') || e.target.closest('#stampModeBar') || e.target.closest('.toolbar') || e.target.closest('.stock-panel');
  if(!ok) exitStampMode();
});
document.addEventListener('click', (e)=>{
  if(!e.target.closest('.global-search-bar') && !e.target.closest('.search-results')) closeSearchResults();
});

window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('globalSearchInput')?.addEventListener('input', e=>runGlobalSearch(e.target.value));
  document.getElementById('searchClearBtn')?.addEventListener('click', ()=>{ const i=document.getElementById('globalSearchInput'); if(i){ i.value=''; i.focus(); } closeSearchResults(); });
  document.getElementById('minimapModal')?.addEventListener('click', e=>{ if(e.target.id==='minimapModal') closeMinimap(); });
  document.getElementById('backupModal')?.addEventListener('click', e=>{ if(e.target.id==='backupModal') closeBackupModal(); });
  document.getElementById('moveModal')?.addEventListener('click', e=>{ if(e.target.id==='moveModal') closeMoveModal(); });
  document.getElementById('linkModal')?.addEventListener('click', e=>{ if(e.target.id==='linkModal') closeLinkModal(); });
  ['month','week','list'].forEach(m=>document.getElementById('btn-'+m)?.classList.toggle('active', m===viewMode));
  render();
  updateBackupBadge();
  renderInspectorEmpty();
});

/* ---------- バックアップ（書き出し／読み込み） ----------
   付箋は各端末のブラウザ内にだけあるため、ファイルに書き出して保管・移行できるようにする。 */
const LS_LAST_EXPORT='canvas_last_export_v1', LS_PRE_IMPORT='canvas_backup_before_import_v1';

function countAllNotes(notes, weekly){
  let n=0;
  const walk=(arr)=>{ (arr||[]).forEach(x=>{ if(x){ n++; walk(x.children); } }); };
  Object.keys(notes||{}).forEach(k=>{ if(Array.isArray(notes[k])) walk(notes[k]); });
  Object.keys(weekly||{}).forEach(k=>{ if(Array.isArray(weekly[k])) walk(weekly[k]); });
  return n;
}
function buildBackup(){
  normalizeAll();
  return { app:'masume-techo-canvas', version:1, exportedAt:new Date().toISOString(), notes:notesData, weekly:weeklyNotesData };
}
function parseBackup(text){
  const o=safeParse(text);
  if(!o || typeof o!=='object' || !o.notes || typeof o.notes!=='object' || Array.isArray(o.notes)) return null;
  return { notes:o.notes, weekly:(o.weekly && typeof o.weekly==='object' && !Array.isArray(o.weekly))?o.weekly:{}, exportedAt:o.exportedAt||'' };
}
function fmtDateTime(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function markExported(){ localStorage.setItem(LS_LAST_EXPORT, new Date().toISOString()); updateBackupBadge(); refreshBackupStatus(); }
function backupOverdue(){
  if(countAllNotes(notesData, weeklyNotesData)===0) return false;
  const last=localStorage.getItem(LS_LAST_EXPORT);
  if(!last) return true;
  return (Date.now()-new Date(last).getTime()) > 7*24*3600*1000;
}
function updateBackupBadge(){
  const b=document.getElementById('backupBadge');
  if(b) b.style.display = backupOverdue() ? 'inline-block' : 'none';
}
function backupMsg(text, isError){
  const m=document.getElementById('backupMsg'); if(!m) return;
  m.textContent=text; m.style.color=isError?'#DC2626':'#047857';
}
function refreshBackupStatus(){
  const s=document.getElementById('backupStatus'); if(!s) return;
  const last=localStorage.getItem(LS_LAST_EXPORT);
  s.textContent = `現在の付箋：${countAllNotes(notesData, weeklyNotesData)}件 ／ 最後の書き出し：${last?fmtDateTime(last):'まだありません'}`;
}
function exportBackupFile(){
  const json=JSON.stringify(buildBackup(), null, 1);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`masume-techo-backup_${todayDateStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  markExported();
  backupMsg('ファイルとして書き出しました（ダウンロード先を確認してください）');
}
function exportBackupClipboard(){
  const json=JSON.stringify(buildBackup());
  const ok=()=>{ markExported(); backupMsg('クリップボードにコピーしました。メモやメッセージ等に貼り付けて保管できます'); };
  const fallback=()=>{
    const ta=document.createElement('textarea'); ta.value=json; document.body.appendChild(ta); ta.select();
    let done=false; try{ done=document.execCommand('copy'); }catch(e){} ta.remove();
    if(done) ok(); else backupMsg('コピーできませんでした。「ファイルに保存」をお使いください', true);
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(ok, fallback); else fallback();
}
function showImportPreview(text){
  const box=document.getElementById('backupPreview'); if(!box) return;
  box.innerHTML='';
  const bk=parseBackup(text);
  if(!bk){ backupMsg('この内容はバックアップとして読み込めません', true); return; }
  backupMsg('');
  const info=document.createElement('div'); info.className='backup-note'; info.style.color='#111827';
  info.textContent=`バックアップ内の付箋：${countAllNotes(bk.notes,bk.weekly)}件`+(bk.exportedAt?`（${fmtDateTime(bk.exportedAt)}に書き出し）`:'')+` ／ 現在：${countAllNotes(notesData,weeklyNotesData)}件`;
  box.appendChild(info);
  const row=document.createElement('div'); row.className='move-row'; row.style.marginTop='8px';
  const b1=document.createElement('button'); b1.type='button'; b1.className='btn-tool'; b1.textContent='置き換える';
  b1.onclick=()=>{ if(confirm('今の付箋をすべてバックアップの内容に置き換えます。\n（置き換え前の状態は自動で退避され、あとで元に戻せます）\nよろしいですか？')){ importReplace(bk); } };
  const b2=document.createElement('button'); b2.type='button'; b2.className='btn-tool'; b2.textContent='追加で取り込む（重複は除く）';
  b2.onclick=()=>importMerge(bk);
  row.appendChild(b1); row.appendChild(b2); box.appendChild(row);
}
function snapshotBeforeImport(){
  normalizeAll();
  localStorage.setItem(LS_PRE_IMPORT, JSON.stringify({savedAt:new Date().toISOString(), notes:notesData, weekly:weeklyNotesData}));
}
function adoptData(nd, wd){
  nd = (nd && typeof nd==='object') ? nd : {};
  wd = (wd && typeof wd==='object') ? wd : {};
  if(!Array.isArray(nd.stock)) nd.stock=[];
  if(!Array.isArray(nd.free)) nd.free=[];
  if(Array.isArray(wd.stock)){ wd.stock.forEach(n=>nd.stock.push(n)); }
  delete wd.stock;
  notesData=nd; weeklyNotesData=wd;
  save(); render(); updateBackupBadge();
}
function importReplace(bk){
  snapshotBeforeImport();
  adoptData(JSON.parse(JSON.stringify(bk.notes)), JSON.parse(JSON.stringify(bk.weekly)));
  renderBackupModal();
  backupMsg('置き換えました');
}
function importMerge(bk){
  snapshotBeforeImport();
  const have=new Set(allNoteRecords().map(x=>x.note.id));
  let added=0;
  const put=(target, key, arr)=>{
    if(!Array.isArray(arr)) return;
    arr.forEach(n=>{
      if(!n || !n.id || have.has(n.id)) return;
      const copy=JSON.parse(JSON.stringify(n));
      const stamp=(x)=>{ have.add(x.id); (x.children||[]).forEach(stamp); };
      stamp(copy); added++;
      target[key]=Array.isArray(target[key])?target[key]:[];
      target[key].push(copy);
    });
  };
  Object.keys(bk.notes).forEach(k=>put(notesData,k,bk.notes[k]));
  Object.keys(bk.weekly).forEach(k=>{ if(k==='stock') put(notesData,'stock',bk.weekly[k]); else put(weeklyNotesData,k,bk.weekly[k]); });
  save(); render(); updateBackupBadge();
  renderBackupModal();
  backupMsg(added?`${added}件を追加しました`:'追加する付箋はありませんでした（すべて取り込み済み）');
}
function restorePreImport(){
  const snap=safeParse(localStorage.getItem(LS_PRE_IMPORT));
  if(!snap || !snap.notes){ backupMsg('元に戻せるデータがありません', true); return; }
  if(!confirm('直前の取り込み前の状態に戻します。今の内容は失われます。よろしいですか？')) return;
  adoptData(snap.notes, snap.weekly);
  localStorage.removeItem(LS_PRE_IMPORT);
  renderBackupModal();
  backupMsg('取り込み前の状態に戻しました');
}
function closeBackupModal(){ document.getElementById('backupModal')?.classList.remove('open'); }
function renderBackupModal(){
  const body=document.getElementById('backupModalBody'); if(!body) return;
  body.innerHTML='';
  const sec=(title)=>{ const s=document.createElement('div'); s.className='backup-section'; const t=document.createElement('div'); t.className='label-sm'; t.style.marginBottom='6px'; t.textContent=title; s.appendChild(t); body.appendChild(s); return s; };
  const btn=(parent,text,fn)=>{ const b=document.createElement('button'); b.type='button'; b.className='btn-tool'; b.textContent=text; b.onclick=fn; parent.appendChild(b); return b; };

  const s1=sec('書き出し（バックアップを作る）');
  const r1=document.createElement('div'); r1.className='move-row'; r1.style.marginBottom='4px';
  btn(r1,'💾 ファイルに保存', exportBackupFile);
  btn(r1,'📋 クリップボードにコピー', exportBackupClipboard);
  s1.appendChild(r1);
  const st=document.createElement('div'); st.className='backup-note'; st.id='backupStatus'; s1.appendChild(st);

  const s2=sec('読み込み（バックアップから戻す・別の端末へ移す）');
  const file=document.createElement('input'); file.type='file'; file.accept='.json,application/json,text/plain';
  file.onchange=()=>{ const f=file.files&&file.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>showImportPreview(String(rd.result||'')); rd.readAsText(f); };
  s2.appendChild(file);
  const ta=document.createElement('textarea'); ta.placeholder='コピーしたバックアップをここに貼り付け'; ta.rows=3;
  ta.style.cssText='width:100%;margin-top:8px;border:1px solid #D1D5DB;border-radius:8px;padding:8px;font-size:12px;';
  s2.appendChild(ta);
  const r2=document.createElement('div'); r2.className='move-row'; r2.style.marginTop='6px';
  btn(r2,'貼り付けた内容を確認', ()=>showImportPreview(ta.value));
  s2.appendChild(r2);
  const pv=document.createElement('div'); pv.id='backupPreview'; s2.appendChild(pv);

  const pre=safeParse(localStorage.getItem(LS_PRE_IMPORT));
  if(pre && pre.notes){
    const s3=sec('直前の取り込みを取り消す');
    const n=document.createElement('div'); n.className='backup-note'; n.textContent=`取り込み前の状態（${fmtDateTime(pre.savedAt)}時点・${countAllNotes(pre.notes,pre.weekly)}件）を保管しています`; s3.appendChild(n);
    const r3=document.createElement('div'); r3.className='move-row'; r3.style.marginTop='6px';
    btn(r3,'↩ 取り込み前に戻す', restorePreImport); s3.appendChild(r3);
  }
  const msg=document.createElement('div'); msg.id='backupMsg'; msg.style.cssText='font-size:12px;font-weight:700;min-height:16px;'; body.appendChild(msg);
  refreshBackupStatus();
}
function openBackup(){ renderBackupModal(); document.getElementById('backupModal').classList.add('open'); }
</script>
